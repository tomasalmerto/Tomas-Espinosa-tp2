<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de pokemones</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./CSS/styles.css">

</head>
<body class="bg-dark text-light">

    <div class="container my-5">

        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-warning">Buscador de pokemon</h1>
            <p class="text-muted">Trabajo Practico Web 2</p>
        </header>

        <div class="row justify-content-center mb-5">
            <div class="col-md-6">

                 <form id="search-form" class="d-flex gap-2">

                    <input type="text" id="search-input" class="form-control form-control-lg bg-secondary text-white border-0" placeholder="Ingresa nombre o ID del Pokémon..." autocomplete="off">

                    <button type="submit" class="btn btn-warning btn-lg fw-bold px-4">Buscar</button>

                    <button type="button" id="btn-reset" class="btn btn-secondary btn-lg fw-bold px-3" title="Restablecer">Restablecer</button>

                </form>
            </div>
        </div>

        <section class="row justify-content-center" aria-label="Resultado de la búsqueda">
            <div class="col-md-6 text-center" id="card-container">
                <p class="text-muted italic">Aún no has buscado ningún Pokémon.</p>
            </div>
        </section>
        
    </div>
    




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
